[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-vllm-blog"
version = "0.1.0"
description = "A minimal LLM inmference engine built for learning"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "safetensors>=0.4,<1",
    "torch==2.8.0",
    "transformers==4.57.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8",
]

[tool.setuptools]
packages = ["mini_vllm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 80
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]